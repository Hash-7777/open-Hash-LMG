[package]
name = "hash-lmg"
version = "0.1.0"
description = "Hash LMG: local motion graphics, made with local and cloud models"
authors = ["Hash LMG"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.87"

[lib]
name = "hash_lmg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The window, the web view and the bridge between the page and these commands.
tauri = { version = "2", features = [] }
# Web links open in the system browser, never in the app's window.
tauri-plugin-opener = "2"
# The system's own save dialog, which is the only way an export picks a place.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The encoders built into the app, compiled from source on every system:
# H.264 for MP4 and MOV, GIF animations, and MP3 for sound where the system
# has no AAC encoder of its own.
openh264 = "0.9"
gif = "0.14"
mp3lame-encoder = "0.2"
# AV1 for WebM, in pure Rust on every system, and Vorbis for its sound, built
# from source with the C compiler alone.
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
vorbis_rs = { version = "0.5", default-features = false }
# Requests to model servers a web page may not ask directly, with the
# system's own TLS.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# On Apple silicon and other ARM chips rav1e's hand-written routines need only
# the C compiler, so they are on there; elsewhere they need an assembler a
# fresh system lacks. Kept last: a target table claims every line under it.
[target.'cfg(target_arch = "aarch64")'.dependencies]
rav1e = { version = "0.8", default-features = false, features = ["threading", "asm"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Libraries are optimised even in a development build: the built-in encoders
# are far too slow to try a real export with otherwise.
[profile.dev.package."*"]
opt-level = 3
